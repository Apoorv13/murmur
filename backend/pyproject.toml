[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "murmur-backend"
version = "0.1.0"
description = "Local-only voice-to-text ML backend for macOS — powered by MLX"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Apoorv Dayal" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "mlx>=0.18.0",
    "mlx-whisper>=0.4.0",
    "numpy>=1.26.0",
    "sounddevice>=0.4.6",
    "textual>=0.79.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
parakeet = [
    "parakeet-mlx>=0.1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5.0",
    "mypy>=1.10",
]

[project.scripts]
murmur-daemon = "murmur.server:main"
murmur-tui = "murmur.tui.app:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "COM", "C4", "PT"]
ignore = ["S101"]  # allow assert in tests

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["mlx_whisper", "parakeet_mlx", "sounddevice"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["murmur"]
